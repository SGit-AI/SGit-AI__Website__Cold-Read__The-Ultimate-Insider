<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The conductor's debrief · Cold read: The ultimate insider</title>
<meta name="description" content="The conductor's debrief of the cold read, as a deck: slides read from deck.json; print or save as PDF for one slide per page.">
<link rel="icon" href="../assets/favicon.svg">
<style>
  :root { --bg: #f7f6f2; --ink: #1d1d1b; --dim: #6b6a64; --rule: #d9d6cc; --accent: #8a3b12; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161614; --ink: #ecebe6; --dim: #a19f97; --rule: #3a3934; --accent: #e08a5a; --card: #1f1f1c; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .slide { display: none; width: min(1100px, 100%); aspect-ratio: 16 / 9; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 48px 56px; overflow: hidden; position: relative; }
  .slide.on { display: flex; flex-direction: column; }
  .kicker { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 18px; }
  .title h1 { font-size: 52px; margin-top: auto; }
  .lead { font-size: 22px; color: var(--dim); margin: 0 0 18px; }
  ul { margin: 0; padding-left: 1.1em; } li { margin: 0 0 8px; }
  table { border-collapse: collapse; margin: 0 0 14px; font-size: 16px; } td, th { text-align: left; padding: 4px 18px 4px 0; border-bottom: 1px solid var(--rule); } th { color: var(--dim); font-weight: 600; }
  .dense { padding: 30px 48px; } .dense h1 { font-size: 28px; margin-bottom: 10px; } .dense table { font-size: 14px; } .dense td, .dense th { padding: 2px 18px 2px 0; } .dense li { margin-bottom: 4px; }
  .cite { margin-top: auto; padding-top: 12px; font-size: 13px; color: var(--dim); border-top: 1px solid var(--rule); }
  .cite code { font-size: 12px; }
  .num { position: absolute; right: 22px; bottom: 14px; font-size: 12px; color: var(--dim); }
  nav.bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center; padding: 8px; font-size: 14px; }
  nav.bar button, nav.bar a { font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 12px; text-decoration: none; cursor: pointer; }
  @media print {
    @page { size: 297mm 167mm; margin: 0; }
    html, body { background: #fff; color: #1d1d1b; }
    :root { --bg: #fff; --ink: #1d1d1b; --dim: #6b6a64; --rule: #d9d6cc; --accent: #8a3b12; --card: #fff; }
    main { display: block; padding: 0; min-height: 0; }
    .slide { display: flex !important; flex-direction: column; width: 297mm; height: 167mm; aspect-ratio: auto; border: 0; border-radius: 0; page-break-after: always; break-after: page; }
    nav.bar { display: none; }
  }
</style>
</head>
<body>
<main id="deck"><p>Loading the deck from <a href="deck.json">deck.json</a>.</p></main>
<nav class="bar" aria-label="Deck"><button type="button" id="prev">previous</button><span id="pos"></span><button type="button" id="next">next</button><a href="cold-read-debrief.pdf">PDF</a><a href="deck.json">JSON</a><a href="../index.html">site</a></nav>
<script>
(function () {
  'use strict'
  var deck = document.getElementById('deck'), slides = [], at = 0
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
  function show(n) {
    at = Math.max(0, Math.min(slides.length - 1, n))
    slides.forEach(function (s, i) { s.classList.toggle('on', i === at) })
    document.getElementById('pos').textContent = (at + 1) + ' / ' + slides.length
    try { history.replaceState(null, '', '#' + (at + 1)) } catch (e) {}
  }
  fetch('deck.json', { cache: 'no-cache' }).then(function (r) { return r.json() }).then(function (d) {
    deck.textContent = ''
    d.slides.forEach(function (s, i) {
      var sec = el('section', 'slide' + (s.kind === 'title' ? ' title' : '') + ((s.table && s.table.length > 7) || (s.points && s.points.length > 5) ? ' dense' : ''))
      sec.appendChild(el('p', 'kicker', s.kicker || d.title))
      sec.appendChild(el('h1', null, s.title))
      if (s.lead) sec.appendChild(el('p', 'lead', s.lead))
      if (s.table) {
        var t = el('table')
        s.table.forEach(function (row, r) { var tr = el('tr'); row.forEach(function (c) { tr.appendChild(el(r ? 'td' : 'th', null, c)) }); t.appendChild(tr) })
        sec.appendChild(t)
      }
      if (s.points && s.points.length) { var ul = el('ul'); s.points.forEach(function (p) { ul.appendChild(el('li', null, p)) }); sec.appendChild(ul) }
      if (s.cite && s.cite.length) {
        var c = el('p', 'cite'); c.appendChild(document.createTextNode('From: '))
        s.cite.forEach(function (p, k) { if (k) c.appendChild(document.createTextNode(' · ')); c.appendChild(el('code', null, p)) })
        sec.appendChild(c)
      }
      sec.appendChild(el('span', 'num', (i + 1) + ' / ' + d.slides.length + ' · ' + d.by + ' · as of ' + d.as_of.slice(0, 16).replace('T', ' ') + ' UTC'))
      deck.appendChild(sec); slides.push(sec)
    })
    show((parseInt(location.hash.slice(1), 10) || 1) - 1)
  }).catch(function () { deck.textContent = 'The deck could not be loaded: open deck.json.' })
  document.getElementById('prev').onclick = function () { show(at - 1) }
  document.getElementById('next').onclick = function () { show(at + 1) }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { show(at + 1); e.preventDefault() }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(at - 1); e.preventDefault() }
  })
})()
</script>
</body>
</html>
